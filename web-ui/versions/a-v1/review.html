<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宝宝计划 · A版设计评审</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#24362f;background:#edf0eb}button,select,a{font:inherit}button,a,select{min-height:44px}button,select{color:inherit;border:1px solid #cdd8cd;background:white;border-radius:8px;cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #61977f;outline-offset:3px}header{padding:16px 24px;background:#fff;border-bottom:1px solid #dbe1d8;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:20px;margin:0 0 5px}header p{font-size:14px;margin:0;color:#65726b}header a{display:inline-flex;align-items:center;padding:0 16px;text-decoration:none;border-radius:8px;color:#214f42;border:1px solid #cdd8cd}.layout{display:grid;grid-template-columns:210px 1fr;height:calc(100vh - 89px)}aside{background:#f9fbf7;border-right:1px solid #dbe1d8;padding:22px 16px;overflow:auto}aside .label{font-size:12px;letter-spacing:1px;color:#65726b;margin:0 8px 10px}nav{display:grid;gap:5px}nav button{text-align:left;padding:0 12px;border-color:transparent;background:transparent}nav button.active{background:#e2ebe1;color:#214f42;font-weight:600}aside label{display:grid;gap:7px;font-size:13px;margin:20px 4px 0}select{padding:0 9px;font-size:14px;width:100%}aside .note{font-size:12px;line-height:1.7;color:#65726b;margin:20px 4px 0}.canvas{overflow:auto;display:flex;flex-direction:column;align-items:center;padding:18px 24px 28px;min-width:0}.caption{width:100%;display:flex;justify-content:space-between;font-size:13px;color:#65726b;margin:0 0 16px;min-height:20px;gap:10px}.stage{position:relative;flex-shrink:0;box-shadow:0 16px 42px #24362f14;background:white;border-radius:10px;overflow:hidden}iframe{border:0;background:white;transform-origin:top left;position:absolute;top:0;left:0}.mode-note{font-size:12px;line-height:1.7;color:#65726b;margin:18px 0 0;max-width:800px;width:100%}.links{display:flex;gap:10px}a.text-link{padding:0 8px;border:none} @media(max-width:700px){header{padding:14px 16px;align-items:flex-start}header p{max-width:200px}.links{display:block}header a{padding:0 10px;font-size:13px}a.text-link{display:none}.layout{display:block;height:auto}aside{padding:12px 16px;border-right:0;border-bottom:1px solid #dbe1d8}aside .label,aside .note{display:none}nav{display:flex;overflow:auto}nav button{flex-shrink:0}aside label{display:inline-grid;width:30%;margin:10px 1% 0;font-size:12px}.canvas{padding:14px 12px}.mode-note{font-size:12px}}
</style></head><body><header><div><h1>A · 日常工作台</h1><p>已确认方向 · 简洁、清楚的家庭工具界面</p></div><div class="links"><a class="text-link" href="overview.html">设计总览</a><a id="open" href="index.html" target="_blank" rel="noopener">打开独立原型 ↗</a></div></header><div class="layout"><aside><p class="label">核心页面</p><nav id="pages"></nav><label>预览设备<select id="device"><option value="desktop">电脑 · 1440 × 900</option><option value="mobile">手机 · 375 × 812</option><option value="tablet">平板 · 1280 × 800</option></select></label><label>阅读字号<select id="type"><option value="normal">标准</option><option value="large">大字</option></select></label><label>状态预览<select id="scenario"><option value="normal">正常示例</option><option value="empty">餐食待安排</option><option value="weather">天气未更新</option><option value="offline">离线</option><option value="ai">推荐不可用</option><option value="conflict">保存时有新改动</option><option value="revoked">大屏授权撤销</option></select></label><p class="note">这些选项用于评审，不属于产品导航。修改保存在本机浏览器。真实账号、天气和设备同步待后续接入。</p><button id="reset" style="margin:18px 4px 0;padding:0 12px;font-size:13px">恢复初始示例</button></aside><section class="canvas"><div class="caption"><span id="page-label">今天</span><span id="size-label"></span></div><div class="stage" id="stage"><iframe id="prototype" title="宝宝计划 A版可交互原型"></iframe></div><p class="mode-note">可以直接点击界面体验换餐、核对食材、调整时间、活动反馈与打印。不同标签页可演示本机联动；时间固定在14:40，日期和餐食均为设计示例。</p></section></div><script>
const routes=[['today','今天'],['meals','饮食'],['pantry','家里食材'],['activities','活动'],['recipe/noodles','菜谱'],['family','家庭'],['display','家庭大屏'],['print','打印预览']];
const sizes={desktop:[1440,900],mobile:[375,812],tablet:[1280,800]};
let config={page:'today',device:'desktop',type:'normal',scenario:'normal'};try{Object.assign(config,JSON.parse(localStorage.getItem('baby-plan-review-v1')||'{}'));}catch(e){}
const el=id=>document.getElementById(id);routes.forEach(([route,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.route=route;b.onclick=()=>{config.page=route;update();};el('pages').appendChild(b);});
for(const key of ['device','type','scenario']){el(key).value=config[key];el(key).onchange=()=>{config[key]=el(key).value;if(key==='scenario'&&config.scenario==='revoked')config.page='display';update();};}
function fit(){const [w,h]=sizes[config.device]||sizes.desktop,available=document.querySelector('.canvas').clientWidth-(innerWidth<700?24:48),scale=Math.min(1,available/w);el('stage').style.width=w*scale+'px';el('stage').style.height=h*scale+'px';el('prototype').style.width=w+'px';el('prototype').style.height=h+'px';el('prototype').style.transform=`scale(${scale})`;el('size-label').textContent=`${w} × ${h} · ${Math.round(scale*100)}%`;}
function update(){if(!routes.some(([r])=>r===config.page))config.page='today';const url=`index.html?text=${config.type}&scenario=${config.scenario}#${config.page}`;el('prototype').src=url;el('open').href=url;el('page-label').textContent=routes.find(([r])=>r===config.page)[1];document.querySelectorAll('[data-route]').forEach(b=>{b.classList.toggle('active',b.dataset.route===config.page);b.setAttribute('aria-pressed',b.dataset.route===config.page);});try{localStorage.setItem('baby-plan-review-v1',JSON.stringify(config));}catch(e){}fit();}
el('reset').onclick=()=>{localStorage.removeItem('baby-plan-selected-a-v2');el('prototype').contentWindow.location.reload();};
el('prototype').addEventListener('load',()=>{const frame=el('prototype').contentWindow;const reflect=()=>{const r=frame.location.hash.slice(1)||'today',label=routes.find(([key])=>key===r)?.[1]||(r.includes('recipe/')?'菜谱':'当前页面');el('page-label').textContent=label;el('open').href=frame.location.href;document.querySelectorAll('[data-route]').forEach(b=>{const on=b.dataset.route===r;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on);});};frame.addEventListener('hashchange',reflect);reflect();});
window.addEventListener('resize',fit);update();
</script></body></html>
