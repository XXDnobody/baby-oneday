name: baby-plan

# 应用由本机 Node.js 运行。这里只提供 PostgreSQL 和 Mailpit。
# 发布到宿主机的端口全部绑定 127.0.0.1。容器内部监听地址仍是容器网卡，
# 这样 Docker 才能把本机回环端口转进去；不向局域网发布。
# PostgreSQL 18 的数据目录是 /var/lib/postgresql/18/docker，卷要挂在 /var/lib/postgresql。

services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: baby-plan-postgres
    environment:
      POSTGRES_USER: baby_plan_dev
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD:?Set POSTGRES_DEV_PASSWORD in .env.compose}
      POSTGRES_DB: baby_plan_dev
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - baby_plan_dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baby_plan_dev -d baby_plan_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres-test:
    image: postgres:18.6-bookworm
    container_name: baby-plan-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: baby_plan_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD in .env.compose}
      POSTGRES_DB: baby_plan_test
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - baby_plan_test:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baby_plan_test -d baby_plan_test"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: baby-plan-mailpit
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_DISABLE_VERSION_CHECK: "1"
      MP_SMTP_DISABLE_RDNS: "1"
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  baby_plan_dev:
    name: baby-plan-dev-data
  baby_plan_test:
    name: baby-plan-test-data
